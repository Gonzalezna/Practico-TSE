name: CI/CD Practico TSE

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: gonzalezna/practico-tse
  OPENSHIFT_NAMESPACE: gonzalezna-dev
  OPENSHIFT_DEPLOYMENT: practico-tse
  OPENSHIFT_CONTAINER: practico-tse

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build con Maven
        run: mvn clean install -B

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push imagen Docker
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} ./ear
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Instalar oc CLI
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/oc/latest/linux/oc.tar.gz | tar xz
          sudo mv oc /usr/local/bin/

      - name: Deploy en OpenShift
        run: |
          oc login --token="${{ secrets.OPENSHIFT_TOKEN }}" --server="${{ secrets.OPENSHIFT_SERVER }}"
          oc set image deployment/${{ env.OPENSHIFT_DEPLOYMENT }} \
          ${{ env.OPENSHIFT_CONTAINER }}=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n ${{ env.OPENSHIFT_NAMESPACE }}
          oc rollout status deployment/${{ env.OPENSHIFT_DEPLOYMENT }} \
            -n ${{ env.OPENSHIFT_NAMESPACE }}